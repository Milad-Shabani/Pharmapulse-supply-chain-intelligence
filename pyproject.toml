[project]
name = "pharmapulse-demand-planning"
version = "1.0.0"
description = "Synthetic pharmaceutical manufacturing & distribution dataset with a global LightGBM quantile demand-forecasting model, ABC/XYZ inventory segmentation, safety-stock planning, expiry-risk analysis, and an Excel + interactive HTML dashboard output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milad Shabani" }]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "plotly>=5.18",
    "xlsxwriter>=3.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py310"
