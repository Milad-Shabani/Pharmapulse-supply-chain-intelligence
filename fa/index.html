:root{--ink:#0f172a;--mut:#64748b;--ln:#e8ecf4;--soft:#f6f8fc;--a:#4f46e5;--g:#059669;--r:#e11d48;--o:#d97706}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.7 Vazirmatn,Inter,system-ui,sans-serif}
.w{max-width:1320px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:9;background:#ffffffeb;backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:12px;min-height:66px;flex-wrap:wrap;padding:8px 0}
.logo{font-weight:800;font-size:19px;letter-spacing:-.4px}.logo b{color:var(--a)}.logo small{display:block;font-size:11px;font-weight:500;color:var(--mut);letter-spacing:0}
.sp{flex:1}
select,input,.btn{font:inherit;border:1px solid var(--ln);border-radius:10px;padding:7px 12px;background:#fff;color:var(--ink);outline:none}
select:focus,input:focus{border-color:var(--a);box-shadow:0 0 0 3px #4f46e51f}.btn{text-decoration:none;font-weight:600}.btn:hover{background:var(--soft)}
h2{font-size:18px;margin:38px 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}h2 small{color:var(--mut);font-weight:500;font-size:12.5px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px;box-shadow:0 10px 30px -18px #0f172a30}
.g{display:grid;gap:14px}.kp{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.dc{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.in{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.k{display:flex;gap:12px;align-items:flex-start}.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.k .l{color:var(--mut);font-size:12.5px}.k .v{font-size:22px;font-weight:750;letter-spacing:-.4px;line-height:1.3}.k .s{font-size:12px;color:var(--mut)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:650;white-space:nowrap}
.dcc{cursor:pointer;transition:.15s}.dcc:hover{border-color:#c7d2fe}.dcc.on{border-color:var(--a);box-shadow:0 0 0 3px #4f46e522}
.dcc h3{margin:0;font-size:15px}.dcc .r{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--mut)}.dcc .r b{color:var(--ink);font-size:14px}
.bar2{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:10px}.bar2 i{display:block;height:100%;border-radius:9px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:16px}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--soft);text-align:start;padding:10px 12px;font-weight:650;color:var(--mut);cursor:pointer;white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-top:1px solid var(--ln);white-space:nowrap}tr:hover td{background:#fafbff}td.n,th.n{text-align:end}
.hm{display:grid;gap:3px;font-size:12px;min-width:760px}.hm div{padding:7px 4px;text-align:center;border-radius:7px}.hm .h{color:var(--mut);font-weight:600;background:none}.hm .rn{text-align:start;font-weight:600;background:none}
.bl{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bl span:first-child{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bl .t{flex:1;height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bl .t i{display:block;height:100%;background:linear-gradient(90deg,#818cf8,var(--a));border-radius:9px}
.al{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}.al:first-of-type{border-top:0}
.mut{color:var(--mut)}footer{color:var(--mut);font-size:12px;padding:30px 0 50px}svg text{font:11px inherit;fill:#64748b}
@media(max-width:640px){.w{padding:0 14px}.k .v{font-size:19px}}
